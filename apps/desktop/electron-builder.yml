appId: com.pi-ling.desktop
productName: pi-ling
copyright: Copyright © 2026

# Use the locally installed Electron binary (avoids re-downloading on every pack).
electronDist: node_modules/electron/dist

directories:
  output: release
  buildResources: assets

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - "**/*.node"
  - "**/node_modules/node-pty/**"
  - "**/node_modules/@openai/codex-*/**"
  - "**/out/main/fs-ext-hook.js"
  - "**/out/main/fs-ext-shim.js"
  - "**/out/main/dsh-approval-policy.js"
  - "**/out/main/dsh-transcript/**"
npmRebuild: false

extraResources:
  - from: ../../.env.example
    to: config/.env.example
  - from: assets/icon-source.png
    to: icon.png
win:
  icon: assets/icon.ico
  # Embed icon/metadata without code signing (signAndEditExecutable skips both).
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
  artifactName: "${productName}-${version}-${arch}-setup.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish: null
